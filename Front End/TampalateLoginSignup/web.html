<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stuntless Navbar</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #fff; /* bukan gradasi seluruh body */
      }
      /* Section pertama dengan gradasi */
      .hero {
        background: linear-gradient(to bottom, #f797b4, #fff);
        padding: 40px 0; /* memberi ruang vertikal */
      }
      .navbar-custom {
        background: #fff;
        border-radius: 15px;
        padding: 10px 20px;
        margin-top: 20px; /* gap dari atas (bagian ini masih dalam gradasi) */
      }
      .navbar-nav {
        background: #ec7fa9;
        border-radius: 8px;
        padding: 5px 15px;
        gap: 20px; /* jarak antar link */
      }
      .navbar-nav .nav-link {
        color: white !important;
        font-weight: 500;
      }
      .navbar-nav .nav-link:hover {
        color: #ffe6ef !important;
      }
      .btn-login {
        background: #ec7fa9;
        color: white;
        border-radius: 50px;
        padding: 6px 20px;
        font-weight: 500;
      }
      .btn-login:hover {
        background: #f797b4;
        color: #fff;
      }
      .navbar-brand img {
        height: 40px;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Section 1 (Hero dengan gradasi pink) -->
    <section class="hero">
      <div class="container">
        <nav
          class="navbar navbar-expand-lg navbar-light navbar-custom shadow-sm"
        >
          <!-- Logo -->
          <a class="navbar-brand d-flex align-items-center" href="#">
            <img
              src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png"
              alt="Logo"
            />
            <span>Stuntless</span>
          </a>

          <!-- Mobile Button -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Menu Tengah -->
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarNav"
          >
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">About</a></li>
              <li class="nav-item">
                <a class="nav-link" href="#">Klasifikasi</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">News</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
            </ul>
          </div>

          <!-- Login Button -->
          <div class="ms-lg-3 d-none d-lg-block">
            <a href="#" class="btn btn-login">Login</a>
          </div>
        </nav>
      </div>
    </section>

    <!-- Section berikutnya (background putih biasa) -->
    <section class="py-5">
      <div class="container">
        <h2>Konten Berikutnya</h2>
        <p>Bagian ini tidak pakai gradasi, hanya section pertama saja.</p>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
